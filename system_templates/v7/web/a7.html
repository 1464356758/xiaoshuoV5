<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>A 系统 V7.0 · 小说工作台</title><link rel="stylesheet" href="./a7.css"></head>
<body><main>
<nav><a href="./">← 个人工作台</a></nav>
<h1>A 系统 V7.0</h1>
<p>把初始化包和本书仓库发给同一个 GPT 工作聊天。选平台、定题后说“开始写”，以后说“下一章”。</p>
<a class="download" href="./downloads/a7-novel-init.zip" download="初始化系统包_A版_V7.0.zip">下载 A 版 V7.0 初始化包</a>
<form id="launch"><label for="repo">本书 GitHub 仓库</label><input type="url" id="repo" required placeholder="https://github.com/用户名/新书仓库" autocomplete="off" spellcheck="false">
<label for="mode">这次要做什么</label><select id="mode"><option value="new">部署一本新书</option><option value="resume">接续已有 A7 作品</option></select>
<button type="submit">生成聊天指令</button></form>
<section id="result" hidden><label for="prompt">发给本书 GPT 的指令</label><textarea id="prompt" rows="8" readonly></textarea><button type="button" id="copy">复制指令</button></section><p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="./a7.mjs"></script></body></html>
